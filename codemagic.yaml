# DSH Go (ccch1mneyyy/dsh-Go) iOS 未签名 IPA —— Codemagic 工作流
#
# 这个仓库只放这一个文件：真正要编的源码在第一步 clone 下来。
# 对应上游 .github/workflows/ios-compile.yml 的 compile 任务，
# 额外加 tooling/ios/prepare-engine.sh（本机引擎）+ 打 Payload/ 成 ipa。

workflows:
  ios-unsigned:
    name: DSH Go iOS · unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.47.7
      xcode: 26.6
      vars:
        UPSTREAM: "https://github.com/ccch1mneyyy/dsh-Go.git"
        UPSTREAM_REF: "main"
    cache:
      cache_paths:
        - $HOME/dsh-src/app/ios/Engine/ish-cache
        - $HOME/dsh-src/app/ios/Engine/build
        - $HOME/dsh-src/tooling/ios/phone-self-runner/target
        - $HOME/.cargo
        - $HOME/.rustup
        - $HOME/.pub-cache
        - $HOME/Library/Caches/Homebrew

    scripts:
      - name: Clone 上游源码
        script: |
          set -e
          cd "$HOME"
          if [ -d "$HOME/dsh-src/.git" ]; then
            # 复用已有对象库，避免重复下载 600MB+
            cd "$HOME/dsh-src"
            git remote set-url origin "$UPSTREAM"
            git fetch --depth 1 origin "$UPSTREAM_REF"
            git reset --hard FETCH_HEAD
            git clean -fd -e app/ios/Engine -e tooling/ios/phone-self-runner/target || true
          else
            mkdir -p "$HOME/dsh-src"
            cd "$HOME/dsh-src"
            git init -q
            git remote add origin "$UPSTREAM" 2>/dev/null || git remote set-url origin "$UPSTREAM"
            git fetch --depth 1 origin "$UPSTREAM_REF"
            git reset --hard FETCH_HEAD
          fi
          echo "commit: $(git rev-parse HEAD)"
          sw_vers
          xcodebuild -version | head -2

      - name: 工具链自检
        script: |
          set -e
          which flutter
          flutter --version
          xcodebuild -version | head -1
          echo "FLUTTER_ROOT=$(dirname "$(dirname "$(which flutter)")")" >> "$CM_ENV"

      - name: iSH / guest 工具链（embed 阶段要用）
        script: |
          set -e
          brew install llvm lld meson ninja || brew upgrade llvm lld meson ninja
          python3 -m venv "$HOME/ish-tools"
          "$HOME/ish-tools/bin/pip" install --quiet --upgrade pip
          "$HOME/ish-tools/bin/pip" install --quiet meson==1.7.2 ninja==1.11.1.4
          LLVM_BIN="$(brew --prefix llvm)/bin"
          LLD_BIN="$(brew --prefix lld)/bin"
          ISH_PATH="$HOME/ish-tools/bin:$LLVM_BIN:$LLD_BIN:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "export PATH=\"$ISH_PATH\"" >> "$CM_ENV"
          echo "export DSH_IOS_ENGINE_WORK=\"$HOME/ios-engine-work\"" >> "$CM_ENV"
          export PATH="$ISH_PATH"
          which meson ninja ld.lld clang
          meson --version
          ld.lld --version

      - name: Python 版本（prepare-engine 要 >= 3.11）
        script: |
          set -e
          python3 -c 'import sys;print("python3 =", sys.version)'
          if [ "$(python3 -c 'import sys;print(1 if sys.version_info>=(3,11) else 0)')" != "1" ]; then
            brew install python@3.12
            PY="$(brew --prefix python@3.12)/bin/python3.12"
            echo "export PYTHON=\"$PY\"" >> "$CM_ENV"
            echo "export PATH=\"$(brew --prefix python@3.12)/bin:\$PATH\"" >> "$CM_ENV"
            "$PY" --version
          fi

      - name: 解析依赖
        script: |
          set -e
          cd "$HOME/dsh-src"
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      - name: 准备本机引擎（NodeMobile + runtime.zip，产物不进 git）
        script: |
          set -e
          cd "$HOME/dsh-src"
          python3 --version
          bash tooling/ios/prepare-engine.sh
          ls -la app/ios/Engine

      - name: Rust 工具链（phone native，pinned 1.99.1）
        script: |
          set -e
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "export PATH=\"$HOME/.cargo/bin:\$PATH\"" >> "$CM_ENV"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
          cd "$HOME/dsh-src/tooling/ios/phone-self-runner"
          # rust-toolchain.toml pins 1.99.1; rustup installs it on first use
          rustup show
          cargo --version
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            rustup target add "$t" || echo "::warning::target $t failed to install"
          done
          rustup target list --installed

      - name: 编译 iOS（未签名）
        script: |
          set -uo pipefail
          export PATH="$HOME/ish-tools/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "PATH=$PATH"
          for t in meson ninja ld.lld clang cargo rustup xcrun; do
            printf '%-8s %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
          cd "$HOME/dsh-src/app"
          APP="build/ios/iphoneos/Runner.app"

          echo "=== 尝试 1：上游 build.sh --release --no-codesign ==="
          bash ../tooling/ios/build.sh --release --no-codesign 2>&1 | tee /tmp/ios-build-1.log
          st1=${PIPESTATUS[0]}
          echo "exit=$st1"
          if [ -d "$APP" ]; then
            echo "::notice::Runner.app 已生成（未签名），继续"
            exit 0
          fi

          echo "=== 诊断：Xcode 真实报错 ==="
          for d in /tmp/xcodebuild_logs build/ios/xcodebuild_logs; do
            [ -d "$d" ] || continue
            for f in "$d"/*.log; do
              [ -f "$f" ] || continue
              echo "--- $f"
              grep -E 'error:|warning: .*sign|Code Sign|provisioning|requires a|Signing for' "$f" | head -25 || true
            done
          done
          grep -E 'error:|Code Sign|provisioning|requires' /tmp/ios-build-1.log | head -25 || true

          echo "=== 尝试 2：xcodebuild 直接编，全局关签名 ==="
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee /tmp/ios-build-2.log | tail -120
          st2=${PIPESTATUS[0]}
          echo "exit=$st2"
          if [ -d "$APP" ]; then
            echo "::notice::xcodebuild 重试成功，Runner.app 已生成"
            exit 0
          fi
          echo "::error::两种方式都没产出 Runner.app"
          exit 1

      - name: 打包 Payload/*.ipa
        script: |
          set -e
          APP="$HOME/dsh-src/app/build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "Runner.app not found"; ls -la "$HOME/dsh-src/app/build/ios" || true
            exit 1
          fi
          ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          bld="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          IPA="$CM_BUILD_DIR/DSH-Go-${ver}-${bld}-ios-unsigned.ipa"
          rm -rf /tmp/payload && mkdir -p /tmp/payload/Payload
          cp -R "$APP" /tmp/payload/Payload/Runner.app
          rm -rf /tmp/payload/Payload/Runner.app/_CodeSignature
          rm -f  /tmp/payload/Payload/Runner.app/embedded.mobileprovision
          ( cd /tmp/payload && zip -qry "$IPA" Payload )
          echo "== ipa =="; ls -lh "$IPA"
          echo "== bundle =="; /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          echo "== minos =="; /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          echo "== arch =="; lipo -info "$APP/Runner"
          echo "== frameworks =="; ls "$APP/Frameworks"
          echo "== plugins =="; ls "$APP/PlugIns" 2>/dev/null || true
          echo "== runtime =="; ls -l "$APP/dsh-runtime" 2>/dev/null || echo "(no dsh-runtime)"
          echo "== entries =="; unzip -l "$IPA" | tail -1
          shasum -a 256 "$IPA" | tee "$IPA.sha256"

    artifacts:
      - $CM_BUILD_DIR/*.ipa
      - $CM_BUILD_DIR/*.sha256
      - $HOME/dsh-src/app/ios/Engine/build/iphoneos/guest/*.framework
      - /tmp/xcodebuild_logs/*.log